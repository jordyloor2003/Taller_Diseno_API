config:
  target: "http://localhost:3000"
  plugins:
    ensure: {} # Falla automáticamente el proceso si no se cumplen los acuerdos de nivel de servicio (SLA)
  phases:
    - duration: 20
      arrivalRate: 5
      name: "1. 🧪 Fase de Calentamiento (Tráfico Base)"
    - duration: 30
      arrivalRate: 15
      rampTo: 50
      name: "2. 🧪 Fase de Saturación Máxima (Pico de Carga)"
  ensure:
    thresholds:
      - "http.response_time.p99": 200 # El 99% de las transacciones debe procesarse en < 200ms (Comportamiento temporal)
    maxErrorRate: 1 # No se permite más del 1% de caídas del socket HTTP

scenarios:
  - name: "Inundación transaccional perimetral (Payloads Mixtos Zod)"
    flow:
      # Flujo A: Datos Correctos -> Evalúa la tubería completa refactorizada
      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Andrés Mendoza"
            cargo: "Software Architect"
            departamento: "I+D"
            sueldo: 4200
          capture:
            json: "$.data._id"
            as: "employeeId"
      - think: 1
      # Flujo B: Datos Corruptos -> Evalúa el rechazo inmediato y óptimo del DTO Zod
      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Al"
            cargo: "Dev"
            departamento: "TI"
            sueldo: -500 # Campo ilegal
      # Flujo C: Sueldo cero -> Límite válido del esquema
      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Lucia Rivera"
            cargo: "QA Engineer"
            departamento: "Calidad"
            sueldo: 0
      # Flujo D: Datos válidos adicionales
      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Mateo Torres"
            cargo: "Backend Developer"
            departamento: "Plataforma"
            sueldo: 3800
      # Flujo E: Nombre menor al mínimo de tres caracteres
      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Li"
            cargo: "Developer"
            departamento: "TI"
            sueldo: 3200
      # Flujo F: Sueldo obligatorio ausente
      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Sofia Morales"
            cargo: "Analyst"
            departamento: "Datos"
      # Flujo G: Sueldo con tipo incorrecto
      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Diego Castillo"
            cargo: "QA Engineer"
            departamento: "Calidad"
            sueldo: "4200"
